<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetSkate Shop</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>StreetSkate Shop</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Profissionais</a>
            <a href="#">Casuais</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <!-- Banner -->
    <section class="banner">
        <h2>Domine as ruas com estilo 🛹</h2>
    </section>

    <!-- Produtos Profissionais -->
    <main>

        <section class="container">
            <h2 class="section-title">Skates Profissionais</h2>

            <div class="produtos">

                <article class="card">
                    <img 
                        src="https://i.pinimg.com/736x/08/2a/09/082a09de84c0f07fc16fb608fec6558c.jpg" 
                        alt="Skate profissional Pro Thunder X"
                    >

                    <h3>Pro Thunder X</h3>

                    <p class="price">R$ 799</p>

                    <button class="btn" type="button">
                        Comprar
                    </button>
                </article>

                <article class="card">
                    <img 
                        src="https://http2.mlstatic.com/D_NQ_NP_784866-MLB75789159274_042024-O-skate-montado-feminino-infantil-menina-crianca-skates-lindos.webp" 
                        alt="Skate Street Master"
                    >

                    <h3>Street Master</h3>

                    <p class="price">R$ 699</p>

                    <button class="btn" type="button">
                        Comprar
                    </button>
                </article>

            </div>
        </section>

        <!-- Produtos Casuais -->
        <section class="container">

            <h2 class="section-title">
                Skates para Uso Diário
            </h2>

            <div class="produtos">

                <article class="card">
                    <img 
                        src="https://cdn.awsli.com.br/591/591154/produto/43544343/697e13219e.jpg" 
                        alt="Skate Urban Ride"
                    >

                    <h3>Urban Ride</h3>

                    <p class="price">R$ 399</p>

                    <button class="btn" type="button">
                        Comprar
                    </button>
                </article>

                <article class="card">
                    <img 
                        src="https://www.espiritooutdoor.com/wp-content/uploads/2015/04/andando-de-skate-em-l-a.jpg" 
                        alt="Skate Daily Cruiser"
                    >

                    <h3>Daily Cruiser</h3>

                    <p class="price">R$ 349</p>

                    <button class="btn" type="button">
                        Comprar
                    </button>
                </article>

            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 StreetSkate Shop - Todos os direitos reservados</p>
    </footer>

</body>
</html>
